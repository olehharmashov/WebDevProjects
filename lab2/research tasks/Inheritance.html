<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Courier New', monospace;
      color: #b91c1c; /* темний червоний */
    }

    /* Виправлення відсутності успадкування через inherit */
    .reset-btn {
      font-family: inherit;
      color: inherit;
    }

    .reset-link {
      color: inherit;
    }
  </style>
</head>
<body>
  <p>Параграф: типографіка та колір успадковуються автоматично.</p>
  <a href="#">Звичайне посилання</a> | 
  <a href="#" class="reset-link">Посилання з color: inherit</a>
  <br><br>
  <button>Стандартна кнопка</button>
  <button class="reset-btn">Кнопка з inherit</button>
</body>
</html>
