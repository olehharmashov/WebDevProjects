<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <style>
      .box {
        width: 200px;
        height: 100px;
        padding: 20px;
        border: 5px solid rgb(70, 69, 69);
        background-color: white;
      }

      .content-box {
        box-sizing: content-box;
      }
      .border-box {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="box content-box">content-box</div>
    <div class="box border-box">border-box</div>
  </body>
</html>
